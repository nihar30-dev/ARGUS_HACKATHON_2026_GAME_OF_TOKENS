spring:
  application:
    name: meetwise

  datasource:
    url: ${DB_URL:jdbc:postgresql://192.1.170.10:5435/meetwise}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:argusadmin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8081

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta/models
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  temperature: 0.3

app:
  demo-mode: ${DEMO_MODE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
