spring.application.name=meetwise
server.port=8081

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/meetwise}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:argusadmin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# LLM Provider switch: gemini | claude  (change here or set LLM_PROVIDER env var)
llm.provider=${LLM_PROVIDER:claude}

# Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.max-tokens=3072
gemini.temperature=0.3

# Claude (Anthropic) — set CLAUDE_API_KEY env var or paste key below
claude.api.key=${CLAUDE_API_KEY:}
claude.model=${CLAUDE_MODEL:claude-sonnet-4-6}
claude.max-tokens=3072
claude.temperature=0.3

# Demo mode — set true to skip all LLM calls and load fallback JSONs
app.demo-mode=${DEMO_MODE:false}

# Actuator
management.endpoints.web.exposure.include=health,info
