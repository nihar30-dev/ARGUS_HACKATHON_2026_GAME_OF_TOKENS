spring.application.name=meetwise
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://192.1.170.10:5435/meetwise}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.max-tokens=1000
gemini.temperature=0.3

# Demo mode — set true to skip Gemini and load fallback JSONs
app.demo-mode=${DEMO_MODE:false}

# Actuator
management.endpoints.web.exposure.include=health,info
